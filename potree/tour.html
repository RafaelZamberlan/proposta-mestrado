<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apresentação 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%275%27 fill=%27%231f5f8b%27/%3E%3Cpath d=%27M16 5v22M5 16h22%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276.5%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="libs/potree/potree.css">
<style>
  :root { --painel: rgba(20, 23, 26, .9); --tinta: #ece9e3; --tinta2: #b4b8bc; --linha: #3a4046; --destaque: #7fb2d6; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15181b; color: var(--tinta);
    font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  #render { position: absolute; inset: 0; }
  #cartao { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(680px, calc(100% - 24px));
    background: var(--painel); border: 1px solid var(--linha); border-radius: 8px; padding: 14px 18px 12px; z-index: 20;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
  #cartao .passo { font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--destaque); letter-spacing: .04em; }
  #cartao h1 { font: 600 19px/1.25 "Source Serif 4", Georgia, serif; margin: 6px 0 6px; }
  #cartao p { margin: 0; color: var(--tinta2); font-size: 14.5px; }
  #controles { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  #controles button { font: 600 14px "IBM Plex Sans", system-ui, sans-serif; border-radius: 5px; padding: 8px 16px; cursor: pointer;
    border: 1px solid var(--linha); background: transparent; color: var(--tinta); }
  #controles button.principal { background: var(--destaque); border-color: var(--destaque); color: #0d1a24; margin-left: auto; }
  #controles button:disabled { opacity: .35; cursor: default; }
  #pontos { display: flex; gap: 6px; }
  #pontos i { width: 8px; height: 8px; border-radius: 50%; background: var(--linha); cursor: pointer; }
  #pontos i.ativo { background: var(--destaque); }
  #legenda { position: absolute; top: 12px; left: 12px; z-index: 20; display: flex; gap: 14px; flex-wrap: wrap;
    background: var(--painel); border: 1px solid var(--linha); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  #legenda:empty { display: none; }
  #legenda span { display: inline-flex; align-items: center; gap: 6px; }
  #legenda i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  #dica { position: absolute; top: 12px; right: 12px; z-index: 20; font-size: 12px; color: var(--tinta2); background: var(--painel);
    border: 1px solid var(--linha); border-radius: 6px; padding: 5px 9px; }
  #carregando { position: absolute; inset: 0; display: grid; place-items: center; z-index: 30; background: #15181b;
    color: var(--tinta2); font-size: 15px; }
  .potree_annotation { font: 600 12px/1 "IBM Plex Sans", system-ui, sans-serif !important; }
  .annotation-titlebar { background: rgba(20, 23, 26, .85) !important; color: #fff !important; border-radius: 4px !important;
    padding: 4px 7px !important; border: 1px solid #3a4046 !important; }
  #potree_map, #potree_sidebar_container, #potree_quick_buttons { display: none !important; }
  @media (max-height: 640px) and (min-width: 561px) {   /* embutido na página: cartão menor, no canto */
    #cartao { left: 12px; bottom: 12px; transform: none; width: min(440px, calc(100% - 24px)); padding: 10px 14px 10px; }
    #cartao h1 { font-size: 16px; margin: 4px 0; }
    #cartao p { font-size: 13px; line-height: 1.45; }
    #controles { margin-top: 8px; }
    #controles button { padding: 6px 12px; font-size: 13px; }
  }
  @media (max-width: 560px) {
    #cartao { bottom: 8px; padding: 10px 12px; }
    #cartao h1 { font-size: 16.5px; }
    #cartao p { font-size: 13.5px; }
    #dica { display: none; }
  }
</style>
</head>
<body>
<div id="render"></div>
<div id="legenda"></div>
<div id="dica">arraste para olhar em volta</div>
<div id="cartao">
  <div class="passo" id="num"></div>
  <h1 id="tit"></h1>
  <p id="txt"></p>
  <div id="controles">
    <button id="voltar" type="button">‹ voltar</button>
    <div id="pontos"></div>
    <button id="proximo" class="principal" type="button">próximo ›</button>
  </div>
</div>
<div id="carregando">carregando as nuvens e as fotos…</div>

<script src="libs/jquery/jquery-3.1.1.min.js"></script>
<script src="libs/other/BinaryHeap.js"></script>
<script src="libs/tween/tween.min.js"></script>
<script src="libs/proj4/proj4.js"></script>
<script src="libs/potree/potree.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const TOUR = q.get('t') || 'avenida';
  const CORES = { 2: '#8d8577', 20: '#8d8577', 5: '#5b9a48', 6: '#c7bfb1', 19: '#d4a63c', 60: '#d6604d', 61: '#2166ac',
                  62: '#9a9a9a', 70: '#bbbbbb' };
  const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const grau = Math.PI / 180;

  window.POTREE_NUVEM_MERCATOR = false;
  proj4.defs('pointcloud', '+proj=utm +zone=23 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
  proj4.defs('WGS84', '+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs');
  const viewer = new Potree.Viewer(document.getElementById('render'), { noDragAndDrop: true });
  viewer.setEDLEnabled(true); viewer.setEDLRadius(1.4); viewer.setEDLStrength(0.35);
  viewer.setFOV(65); viewer.setPointBudget(4_000_000); viewer.setBackground('black'); viewer.setMinNodeSize(5);
  window.viewer = viewer;

  let cfg, imagens, passo = 0, linhasObjs = [], rotulos = [], cores = CORES;
  const nuvens = {}, porNome = {};

  // ---------- linhas 3D (edificações do GeoSampa): o mesmo truque do viewer do TCC, que pega as classes de linha de
  // uma medição do Potree (este build não expõe o three.js), na cena de sobreposição (a esfera da foto cobre a principal)
  function criarLinhas(A) {
    const V3 = viewer.scene.view.position.constructor;
    const tmp = new Potree.Measure();
    tmp.addMarker(new V3(0, 0, 0)); tmp.addMarker(new V3(1, 0, 0));
    const e = tmp.edges[0];
    const LineSegments2 = Object.getPrototypeOf(e.constructor.prototype).constructor;
    const LineSegmentsGeometry = Object.getPrototypeOf(e.geometry.constructor.prototype).constructor;
    const LineMaterial = e.material.constructor;
    const cena = viewer.measuringTool ? viewer.measuringTool.scene : viewer.scene.scene;
    for (const [chave, cor] of [['telhado', 0x3d8bff], ['quinas', 0x9ec5ff]]) {
      if (!A[chave] || !A[chave].length) continue;
      const g = new LineSegmentsGeometry();
      g.setPositions(A[chave]);
      const m = new LineMaterial({ color: cor, linewidth: 3, resolution: e.material.resolution.clone() });
      m.depthTest = false;
      const o = new LineSegments2(g, m);
      o.position.set(...A.origem);
      o.frustumCulled = false;
      o.visible = false;
      cena.add(o);
      linhasObjs.push(o);
    }
    viewer.addEventListener('update', () => {
      const el = viewer.renderer.domElement;
      linhasObjs.forEach(o => o.material.resolution.set(el.clientWidth, el.clientHeight));
    });
  }

  // ---------- fotos 360
  function orientar(im) {                         // a mesma rotação do Images360.focus do potree.js
    const s = imagens.sphere;
    s.position.set(...im.position);
    s.rotation.set((+im.roll + 90) * grau, -im.pitch * grau, (-im.course + 90) * grau, 'ZYX');
  }
  function aplicarPose(im, v) {
    im.position = [v[0], v[1], v[2]];
    [im.course, im.pitch, im.roll] = [v[3], v[4], v[5]];
    im.mesh.position.set(v[0], v[1], v[2]);
  }
  const direcao = ([az, el]) => [Math.sin(az * grau) * Math.cos(el * grau), Math.cos(az * grau) * Math.cos(el * grau), Math.sin(el * grau)];

  function entrarFoto(p) {
    const im = porNome[p.foto], v = cfg.poses[p.foto][p.modo], d = direcao(p.olhar);
    aplicarPose(im, v);
    if (imagens.focusedImage === im) {             // mesma foto, outra pose: a esfera gira e a câmera vai junto
      orientar(im);
      viewer.scene.view.setView(v.slice(0, 3).map((x, k) => x - d[k] * 1e-6), v.slice(0, 3), 900);
      return;
    }
    if (imagens.focusedImage) imagens.unfocus(viewer);
    viewer.scene.view.position.set(...v.slice(0, 3).map((x, k) => x - d[k] * 5));
    imagens.focus(im, viewer);
    imagens.elUnfocus.style.display = 'none';
  }

  function sairFoto() {
    if (!imagens.focusedImage) return;
    imagens.sphere.visible = false;
    imagens.sphere.material.map = null;
    imagens.focusedImage = null;
    imagens.selectingEnabled = false;
    viewer.orbitControls.doubleClockZoomEnabled = true;
  }

  // ---------- passos
  function legenda(p) {
    const L = document.getElementById('legenda'), itens = [];
    if (p.mostrar.includes('cameras')) itens.push([CORES[60], 'GPS'], [CORES[61], 'pose ajustada']);
    if (p.linhas) itens.push(['#3d8bff', 'edificações do GeoSampa']);
    if (TOUR === 'trj2' && p.mostrar.some(m => ['copa', 'tronco', 'casco'].includes(m))) itens.push(['#888', 'uma cor por árvore']);
    if (p.mostrar.includes('lidar') && !p.foto) itens.push([cores[6], 'prédio'], [cores[5], 'árvore'], [cores[2], 'chão']);
    L.innerHTML = itens.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
  }

  function irPara(k) {
    passo = Math.max(0, Math.min(cfg.passos.length - 1, k));
    const p = cfg.passos[passo];
    for (const [id, pc] of Object.entries(nuvens)) pc.visible = p.mostrar.includes(id);
    linhasObjs.forEach(o => o.visible = !!p.linhas);
    rotulos.forEach(a => a.visible = !!p.rotulos);
    viewer.setFOV(p.fov || 55);
    if (p.foto) entrarFoto(p);
    else {                                         // fora da foto: Earth Control (arrastar move, botão direito gira)
      sairFoto();
      viewer.setControls(viewer.earthControls);
      viewer.scene.view.setView(p.vista.posicao, p.vista.alvo, 1200);
    }
    document.getElementById('num').textContent = `PASSO ${passo + 1} DE ${cfg.passos.length}`;
    document.getElementById('tit').textContent = p.titulo;
    document.getElementById('txt').textContent = p.texto;
    document.getElementById('voltar').disabled = passo === 0;
    const prox = document.getElementById('proximo');
    prox.textContent = passo === cfg.passos.length - 1 ? 'recomeçar' : 'próximo ›';
    document.querySelectorAll('#pontos i').forEach((b, i) => b.classList.toggle('ativo', i === passo));
    document.getElementById('dica').textContent = p.foto ? 'arraste para olhar em volta'
      : 'arraste para mover · botão direito gira · roda aproxima';
    legenda(p);
    const u = new URLSearchParams(location.search); u.set('passo', passo + 1); history.replaceState(null, '', '?' + u);
  }
  document.getElementById('voltar').onclick = () => irPara(passo - 1);
  document.getElementById('proximo').onclick = () => irPara(passo === cfg.passos.length - 1 ? 0 : passo + 1);
  document.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowRight' || ev.key === ' ') irPara(passo + 1);
    if (ev.key === 'ArrowLeft') irPara(passo - 1);
  });

  // ---------- carga
  (async () => {
    cfg = await (await fetch(`tour/${TOUR}.json`)).json();
    document.title = cfg.titulo;
    cores = Object.assign({}, CORES, cfg.cores || {});
    const esquema = { DEFAULT: { visible: true, name: 'outra', color: [0.6, 0.6, 0.6, 1] } };
    for (const [k, h] of Object.entries(cores)) esquema[k] = { visible: true, name: k, color: [...hexRGB(h), 1] };
    viewer.setClassifications(esquema);
    document.getElementById('pontos').innerHTML = cfg.passos.map((_, i) => `<i title="passo ${i + 1}"></i>`).join('');
    document.querySelectorAll('#pontos i').forEach((b, i) => b.onclick = () => irPara(i));

    const cargas = cfg.camadas.map(c => new Promise(ok => Potree.loadPointCloud(c.caminho, c.id, e => {
      const pc = e.pointcloud, m = pc.material;
      m.size = c.tamanho; m.pointSizeType = Potree.PointSizeType.FIXED;
      m.activeAttributeName = c.cor === 'classe' ? 'classification' : 'rgba';
      if (c.brilho) m.rgbBrightness = c.brilho;
      pc.visible = false;
      viewer.scene.addPointCloud(pc);
      nuvens[c.id] = pc;
      ok();
    })));
    imagens = await Potree.Images360Loader.load(cfg.fotos, viewer, { transform: proj4('WGS84', 'pointcloud') });
    for (const im of imagens.images) {
      const nome = im.file.split('/').pop().replace('.jpg', '.webp');
      porNome[nome] = im;
      im.mesh.visible = false;
      im.mesh.scale.set(0.3, 0.3, 0.3);
    }
    imagens.selectingEnabled = false;
    const mostrarEsferas = imagens.unfocus.bind(imagens);   // o unfocus do Potree religa as esferas: aqui ficam ocultas
    imagens.unfocus = v => { mostrarEsferas(v); imagens.images.forEach(i => i.mesh.visible = false); imagens.selectingEnabled = false; };
    viewer.scene.add360Images(imagens);
    if (cfg.linhas) criarLinhas(await (await fetch(cfg.linhas)).json());
    for (const r of cfg.rotulos || []) {
      const a = new Potree.Annotation({ position: r.posicao, title: r.texto });
      a.visible = false;
      viewer.scene.annotations.add(a);
      rotulos.push(a);
    }
    await Promise.all(cargas);
    document.getElementById('carregando').remove();
    irPara((+q.get('passo') || 1) - 1);
  })();

  // ---------- só na montagem (apresentacao/servidor.py): quadros para o site
  // os rótulos do Potree são HTML e não saem no canvas: aqui eles são desenhados por cima de cada quadro
  function desenharRotulos(ctx, L, A) {
    if (!cfg.passos[passo].rotulos) return;
    const V3 = viewer.scene.view.position.constructor, cam = viewer.scene.getActiveCamera();
    ctx.font = '600 15px "IBM Plex Sans", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (const r of cfg.rotulos || []) {
      const v = new V3(...r.posicao).project(cam);
      if (v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05) continue;
      const x = (v.x + 1) / 2 * L, y = (1 - v.y) / 2 * A, w = ctx.measureText(r.texto).width + 14;
      ctx.fillStyle = 'rgba(20, 23, 26, .82)';
      ctx.fillRect(x - w / 2, y - 24, w, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(r.texto, x - w / 2 + 7, y - 13);
    }
  }

  // volta em torno de um ponto, quadro a quadro: fig/quadros/<nome>_NNN.jpg (o ffmpeg junta em vídeo)
  window.gravarOrbita = async (nome, o) => {
    const L = o.largura || 1280, A = o.altura || 720, N = o.quadros || 288;
    const area = document.getElementById('render');
    Object.assign(area.style, { width: L + 'px', height: A + 'px', right: 'auto', bottom: 'auto' });
    const pos = k => {
      const t = (o.inicio || 0) * grau + 2 * Math.PI * k / N * (o.voltas || 1);
      return [o.centro[0] + o.raio * Math.sin(t), o.centro[1] - o.raio * Math.cos(t), o.centro[2] + o.elevacao];
    };
    viewer.scene.view.setView(pos(0), o.centro, 0);
    await new Promise(r => setTimeout(r, o.espera || 6000));
    const tela = document.createElement('canvas'); tela.width = L; tela.height = A;
    const ctx = tela.getContext('2d');
    for (let k = 0; k < N; k++) {
      viewer.scene.view.setView(pos(k), o.centro, 0);
      viewer.update(1 / 30, performance.now());
      viewer.renderer.setSize(L, A);               // o laço do Potree pode não ter rodado com a área nova
      const cam = viewer.scene.getActiveCamera();
      cam.aspect = L / A; cam.updateProjectionMatrix();
      viewer.render();
      ctx.fillStyle = '#15181b'; ctx.fillRect(0, 0, L, A);
      ctx.drawImage(viewer.renderer.domElement, 0, 0, L, A);
      desenharRotulos(ctx, L, A);
      await fetch(`/salvar?nome=fig/quadros/${nome}_${String(k).padStart(3, '0')}.jpg`,
                  { method: 'POST', body: tela.toDataURL('image/jpeg', 0.92) });
    }
    Object.assign(area.style, { width: '', height: '', right: '', bottom: '' });
    return N;
  };

  // prévia estática: quadro em JPEG
  window.capturar = async (largura = 1200, altura = 675, espera = 4000) => {
    const area = document.getElementById('render');
    Object.assign(area.style, { width: largura + 'px', height: altura + 'px', right: 'auto', bottom: 'auto' });
    await new Promise(r => setTimeout(r, espera));
    viewer.render();
    const tela = document.createElement('canvas'); tela.width = largura; tela.height = altura;
    const ctx = tela.getContext('2d'); ctx.fillStyle = '#15181b'; ctx.fillRect(0, 0, largura, altura);
    ctx.drawImage(viewer.renderer.domElement, 0, 0, largura, altura);
    Object.assign(area.style, { width: '', height: '', right: '', bottom: '' });
    return tela.toDataURL('image/jpeg', 0.88);
  };
</script>
</body>
</html>
